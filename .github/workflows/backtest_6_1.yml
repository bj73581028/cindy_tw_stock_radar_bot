name: Taiwan Stock Radar 6.1 Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "回測模式：SINGLE / MULTI / ALL"
        required: true
        default: "SINGLE"

      stock_codes:
        description: "股票代號，例如 3563 或 3563,2330,2454"
        required: true
        default: "3563"

      start_date:
        description: "開始日期，例如 2025-10-01"
        required: true
        default: "2025-10-01"

      end_date:
        description: "結束日期，例如 2026-09-30"
        required: true
        default: "2026-09-30"

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run 6.1 Backtest
        env:
          MODE: ${{ github.event.inputs.mode }}
          STOCK_CODES: ${{ github.event.inputs.stock_codes }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          python backtest_6_1.py

      - name: Upload Backtest Results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-6-1-results
          path: |
            backtest_results.csv
            backtest_summary.csv
            backtest_dashboard.html
