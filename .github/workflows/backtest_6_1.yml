name: Taiwan Stock Radar 6.1 Technical Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: taiwan-stock-radar-telegram
  cancel-in-progress: false

jobs:
  bot:
    name: Taiwan Stock Radar 6.1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Check Telegram Secret
        env:
          BACKTEST_TELEGRAM_BOT_TOKEN: ${{ secrets.BACKTEST_TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$BACKTEST_TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ BACKTEST_TELEGRAM_BOT_TOKEN 未讀取"
            exit 1
          fi
          echo "✅ BOT TOKEN：已讀取"

      - name: Run bot
        env:
          BACKTEST_TELEGRAM_BOT_TOKEN: ${{ secrets.BACKTEST_TELEGRAM_BOT_TOKEN }}
        run: python backtest_6_1.py
