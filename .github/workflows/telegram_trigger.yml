name: Telegram Backtest Trigger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  telegram-trigger:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 下載 Repository
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 安裝 requests
      # ======================================================

      - name: Install requests
        run: |
          pip install requests


      # ======================================================
      # Telegram Backtest Trigger
      # ======================================================

      - name: Check Telegram Backtest Commands

        env:

          # ==================================================
          # Taiwan Stock Radar 6.1 Backtest Telegram Bot
          #
          # GitHub Secret 名稱：
          # BACKTEST_TELEGRAM_BOT_TOKEN
          #
          # Python 使用的環境變數：
          # TELEGRAM_BOT_TOKEN
          # ==================================================

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.BACKTEST_TELEGRAM_BOT_TOKEN }}


          # ==================================================
          # GitHub Personal Access Token
          # 用來觸發原本的 Backtest Workflow
          # ==================================================

          MY_GITHUB_TOKEN:
            ${{ secrets.MY_GITHUB_TOKEN }}


          # ==================================================
          # GitHub Repository
          # ==================================================

          GITHUB_OWNER:
            bj73581028

          GITHUB_REPO:
            cindy_tw_stock_radar_bot


          # ==================================================
          # repository_dispatch event type
          # ==================================================

          GITHUB_EVENT_TYPE:
            backtest


        run: |
          python telegram_trigger.py
