name: Telegram Backtest Trigger

on:
  workflow_dispatch:

  schedule:
    # 每 1 分鐘檢查一次 Telegram
    - cron: "* * * * *"

permissions:
  contents: read

jobs:

  telegram-trigger:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # 安裝 requests
      # ======================================================

      - name: Install requests

        run: |

          pip install requests


      # ======================================================
      # 還原 Telegram Offset
      #
      # 避免每次 Actions 執行都重新抓舊訊息
      # ======================================================

      - name: Restore Telegram Offset

        uses: actions/cache/restore@v4

        with:

          path: telegram_offset.txt

          key: telegram-offset-${{ github.repository }}


      # ======================================================
      # Telegram Trigger
      # ======================================================

      - name: Check Telegram Backtest Commands

        env:

          # ==================================================
          # Telegram Bot
          #
          # GitHub Secret：
          # BACKTEST_TELEGRAM_BOT_TOKEN
          # ==================================================

          TELEGRAM_BOT_TOKEN:
            ${{ secrets.BACKTEST_TELEGRAM_BOT_TOKEN }}


          # ==================================================
          # GitHub PAT
          # ==================================================

          MY_GITHUB_TOKEN:
            ${{ secrets.MY_GITHUB_TOKEN }}


          # ==================================================
          # Repository
          # ==================================================

          GITHUB_OWNER:
            bj73581028

          GITHUB_REPO:
            cindy_tw_stock_radar_bot

          GITHUB_EVENT_TYPE:
            backtest


        run: |

          python telegram_trigger.py


      # ======================================================
      # 保存 Telegram Offset
      # ======================================================

      - name: Save Telegram Offset

        uses: actions/cache/save@v4

        if: always()

        with:

          path: telegram_offset.txt

          key: telegram-offset-${{ github.repository }}
