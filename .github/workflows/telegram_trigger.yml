name: Telegram Backtest Trigger

on:

  # 每 5 分鐘檢查一次 Telegram
  schedule:
    - cron: "*/5 * * * *"

  # 允許手動執行
  workflow_dispatch:

permissions:
  contents: read

jobs:

  telegram-trigger:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ======================================================
      # 安裝 requests
      # ======================================================

      - name: Install requests
        run: |
          pip install requests


      # ======================================================
      # 執行 Telegram Trigger
      # ======================================================

      - name: Check Telegram Commands

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

          GITHUB_OWNER: bj73581028

          GITHUB_REPO: cindy_tw_stock_radar_bot

        run: |

          python telegram_trigger.py
