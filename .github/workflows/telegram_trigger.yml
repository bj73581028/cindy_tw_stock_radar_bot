name: Telegram Backtest Trigger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  telegram-trigger:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 下載 Repository
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # 安裝 requests
      # ======================================================

      - name: Install requests

        run: |

          pip install requests


      # ======================================================
      # Telegram Backtest Trigger
      # ======================================================

      - name: Check Telegram Backtest Commands

        env:

          # ⚠️ 重點：
          # 使用「原本 Backtest」的 Telegram Bot
          # 不再使用 TELEGRAM_BOT_TOKEN

          BACKTEST_TELEGRAM_BOT_TOKEN:
            ${{ secrets.BACKTEST_TELEGRAM_BOT_TOKEN }}

          # GitHub PAT
          MY_GITHUB_TOKEN:
            ${{ secrets.MY_GITHUB_TOKEN }}

          GITHUB_OWNER:
            bj73581028

          GITHUB_REPO:
            cindy_tw_stock_radar_bot

        run: |

          python telegram_trigger.py
